id = "ccc-herdr"
name = "CCC Herdr"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "ccc fleet companion: fuzzy-jump to any agent or pane by id, name, title, or role."
platforms = ["linux", "macos"]

# CGO_ENABLED=0: net and os/user have pure-Go paths, and a host with go but
# no C compiler (the NixOS desks) otherwise fails on runtime/cgo.
[[build]]
command = ["env", "CGO_ENABLED=0", "go", "build", "-o", "./bin/ccc-herdr", "."]

# The painter is a resident process, so the plugin owns its lifecycle: herdr
# runs [[startup]] once per enabled plugin after session restore and again on
# live handoff. `painter start` detaches and exits (flock singleton, so a
# second run no-ops), or kickstarts the launchd job where one is loaded —
# herdr never supervises it.
[[startup]]
command = ["./bin/ccc-herdr", "painter", "start"]

[[actions]]
id = "jump"
title = "CCC: jump to agent"
description = "Fuzzy-find an agent or pane and jump to it."
contexts = ["tab", "pane"]
command = ["./bin/ccc-herdr", "jump"]

[[actions]]
id = "openfile"
title = "CCC: open file"
description = "Fuzzy-find a file path in the pane's output and open it in the editor."
contexts = ["tab", "pane"]
command = ["./bin/ccc-herdr", "openfile"]

[[panes]]
id = "jumper"
title = "Jump to agent"
placement = "popup"
width = "70%"
height = 20
command = ["./bin/ccc-herdr", "jumper"]

[[panes]]
id = "filepicker"
title = "Open file"
placement = "popup"
width = "70%"
height = 20
command = ["./bin/ccc-herdr", "filepicker"]

[[panes]]
id = "opener"
title = "Editor"
command = ["./bin/ccc-herdr", "open-exec"]
